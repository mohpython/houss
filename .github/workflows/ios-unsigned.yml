name: iOS IPA (non signé, Sideloadly)

# Construit les IPA iOS NON SIGNÉS sur un runner macOS GitHub :
#   - SAHA Santé     (application patient)
#   - SAHA Pharmacie (espace professionnel)
# Les IPA sont ensuite signés avec un Apple ID gratuit via Sideloadly (Windows).
#
# Le dépôt étant public, les minutes macOS de GitHub Actions sont gratuites.
# Déclenchement : automatique à chaque push sur main (fichiers mobiles) ou
# manuel depuis l'onglet Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-unsigned.yml"
      - "App-mobile/ios/**"
      - "App-mobile/lib/**"
      - "App-mobile/assets/**"
      - "App-mobile/pubspec.yaml"
      - "App-mobile/pubspec.lock"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: IPA ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: patient
            artifact: SAHA-Sante
          - variant: pharmacy
            artifact: SAHA-Pharmacie

    defaults:
      run:
        working-directory: App-mobile

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Dépendances Flutter
        run: flutter pub get

      - name: Dépendances iOS (CocoaPods)
        run: |
          cd ios
          pod install
          cd ..

      - name: Nom affiché (variante pharmacie)
        if: matrix.variant == 'pharmacy'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SAHA Pharmacie" ios/Runner/Info.plist

      - name: Compiler l'app sans signature
        run: |
          if [ "${{ matrix.variant }}" = "pharmacy" ]; then
            flutter build ios --release --no-codesign --dart-define=APP_VARIANT=pharmacy
          else
            flutter build ios --release --no-codesign
          fi

      - name: Empaqueter l'IPA non signé
        run: |
          set -euo pipefail
          rm -rf Payload "${{ matrix.artifact }}-unsigned.ipa"
          mkdir -p Payload
          # ditto préserve les liens symboliques et permissions des frameworks.
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry "${{ matrix.artifact }}-unsigned.ipa" Payload
          shasum -a 256 "${{ matrix.artifact }}-unsigned.ipa"
          ls -lh "${{ matrix.artifact }}-unsigned.ipa"

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-unsigned-ipa
          path: App-mobile/${{ matrix.artifact }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
