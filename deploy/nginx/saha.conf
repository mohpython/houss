# Nginx — reverse proxy vers l'application Node (PM2, port 3000).
# Installé par deploy/setup-vps.sh dans /etc/nginx/sites-available/saha
# puis sécurisé en HTTPS par : certbot --nginx -d DOMAINE -d www.DOMAINE

upstream saha_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE www.DOMAINE;

    # Photos d'ordonnances : jusqu'à 15 Mo
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fichiers statiques versionnés par Vite : cache long
    location /assets/ {
        proxy_pass http://saha_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Flux temps réel (Server-Sent Events) : pas de mise en tampon
    location /api/realtime {
        proxy_pass http://saha_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Le jeton est passé en paramètre : ne pas l'écrire dans les journaux
        access_log off;
    }

    location / {
        proxy_pass http://saha_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # l'analyse IA d'une ordonnance peut prendre du temps
    }
}
